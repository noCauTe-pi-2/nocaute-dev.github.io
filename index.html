
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">

    <!-- Título da página -->
    <title>noCauTe | Nossa equipe</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Arquivo JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <main class="page">

        <!-- ==============================
             CABEÇALHO
        =============================== -->

        <header>

            <span class="eyebrow">
                TECNOLOGIA • CONEXÃO
            </span>

            <h1>no<span class="accent">C</span>au<span class="accent">T</span>e<span class="dot">.</span></h1>

            <p>
                Conheça quem está por trás do projeto.
            </p>

        </header>

        <!-- ==============================
             EQUIPE DE DESENVOLVIMENTO
        =============================== -->

        <section aria-labelledby="team-title">

            <h2 id="team-title">
                Nossa equipe
            </h2>

            <!-- Integrantes inseridos pelo JavaScript -->
            <div id="team" class="team"></div>

            <noscript>
                Ative o JavaScript para visualizar os integrantes.
            </noscript>

        </section>

        <!-- ==============================
             LINKS DO PROJETO
        =============================== -->

        <section id="project" hidden aria-labelledby="project-title">

            <h2 id="project-title">
                Explore o projeto
            </h2>

            <!-- Links inseridos pelo JavaScript -->
            <div id="project-links" class="links"></div>

        </section>

        <!-- ==============================
             RODAPÉ
        =============================== -->

        <footer>

            noCauTe — Projeto Integrador <span id="year"></span>

        </footer>

    </main>

</html>
